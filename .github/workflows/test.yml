name: test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-test-linux:
    name: linux ${{ matrix.kernel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel: 4.4.302
            kernel-tag: v4.4.302
            force-9p: true
            version: v4.4-gcc-gnu89-hostcc-no-stack-9p
            compiler: gnu89
            kconfig: .github/kconfigs/legacy-kernel.config
            expect-pidfd: unavailable
          - kernel: 5.4.302
            kernel-tag: v5.4.302
            force-9p: true
            version: v5.4-9p
            compiler: default
            expect-pidfd: available
          - kernel: 5.15.211
            kernel-tag: v5.15.211
            force-9p: false
            version: v5.15-virtiofs
            compiler: default
            expect-pidfd: available
          - kernel: 6.6.144
            kernel-tag: v6.6.144
            force-9p: false
            version: v6.6-virtiofs
            compiler: default
            expect-pidfd: available
          - kernel: 6.18.39
            kernel-tag: v6.18.39
            force-9p: false
            version: v6.18-virtiofs
            compiler: default
            expect-pidfd: available

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download Go modules for VM
        run: go mod download

      - name: Prepare kernel compiler
        id: kernel-compiler
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "gnu89" ]; then
            compiler="$RUNNER_TEMP/crosspty-gcc-gnu89"
            printf '%s\n' '#!/bin/sh' 'exec gcc "$@" -std=gnu89 -fcommon' > "$compiler"
            chmod +x "$compiler"
            hostcc="$(command -v gcc)"
          else
            compiler=""
            hostcc=""
          fi
          echo "cc=$compiler" >> "$GITHUB_OUTPUT"
          echo "hostcc=$hostcc" >> "$GITHUB_OUTPUT"

      - name: Run tests in Linux ${{ matrix.kernel }} VM
        uses: Kodecable/fork-vng-action@f03d101895186f2d35879fe3dda946aaa89da211
        with:
          name: crosspty-linux-${{ matrix.kernel }}
          kernel-url: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          kernel-tag: ${{ matrix.kernel-tag }}
          version: ${{ matrix.version }}
          force-9p: ${{ matrix.force-9p }}
          disable-kvm: true
          qemu-opts: -cpu qemu64
          run-timeout: 900
          kconfig: ${{ matrix.kconfig }}
          cc: ${{ steps.kernel-compiler.outputs.cc }}
          hostcc: ${{ steps.kernel-compiler.outputs.hostcc }}
          vmlinux-h: false
          run: |
            set -eu
            uname -a
            case "$(uname -r)" in
              ${{ matrix.kernel }}*) ;;
              *) echo "unexpected guest kernel: $(uname -r)" >&2; exit 1 ;;
            esac
            CROSSPTY_EXPECT_PIDFD=${{ matrix.expect-pidfd }} go test -coverprofile coverage.txt -count=1 -v -timeout=10m ./...

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Diagnostics for the Linux 4.4 guest hanging right after "Booting the
  # kernel." (first seen after the noble QEMU 1:8.2.2+ds-0ubuntu1.18 update).
  # A/B boots the same cached kernel on the current QEMU and on 1.17, and
  # samples the guest RIP over the gdbstub while it is stuck.
  linux-4-4-diag:
    name: linux 4.4.302 diag (qemu ${{ matrix.qemu }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        qemu:
          - current
          - 8.2.2+ds-0ubuntu1.17

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned QEMU
        if: matrix.qemu != 'current'
        shell: bash
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          for pkg in qemu-system-x86_${{ matrix.qemu }}_amd64 qemu-system-common_${{ matrix.qemu }}_amd64 qemu-system-data_${{ matrix.qemu }}_all; do
            curl -fsSLO "https://launchpad.net/ubuntu/+archive/primary/+files/$pkg.deb"
          done
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends --allow-downgrades ./qemu-system-*.deb
          sudo apt-mark hold qemu-system-x86 qemu-system-common qemu-system-data

      - name: Install gdb
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb

      - name: Start RIP sampler
        shell: bash
        run: |
          set -eu
          out="$RUNNER_TEMP/rip-samples.txt"
          echo "RIP_SAMPLES=$out" >> "$GITHUB_ENV"
          nohup bash -c '
            for _ in $(seq 1 120); do
              ss -ltn | grep -q ":1234 " && break
              sleep 5
            done
            sleep 120
            for n in 1 2 3 4 5; do
              echo "=== sample $n $(date -u +%T)"
              timeout 30 gdb -q -batch -nx \
                -ex "set architecture i386:x86-64" \
                -ex "target remote :1234" \
                -ex "info registers rip" -ex "info registers rsp" \
                -ex "info registers eflags" -ex "info registers cs" \
                -ex "info registers cr0" -ex "info registers cr3" \
                -ex "info registers cr4" -ex "info registers efer" \
                -ex "x/6i \$pc" \
                -ex "detach" 2>&1
              sleep 10
            done
          ' > "$out" 2>&1 &

      - name: Boot Linux 4.4.302 VM
        id: boot
        continue-on-error: true
        uses: Kodecable/fork-vng-action@f03d101895186f2d35879fe3dda946aaa89da211
        with:
          name: crosspty-linux-4.4.302
          kernel-url: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          kernel-tag: v4.4.302
          version: v4.4-gcc-gnu89-hostcc-no-stack-9p
          force-9p: true
          disable-kvm: true
          qemu-opts: -cpu qemu64 -no-reboot -gdb tcp::1234 -d cpu_reset,guest_errors,unimp -D ${{ runner.temp }}/qemu-debug.log
          append: mitigations=off earlyprintk=serial,ttyS0,115200,keep ignore_loglevel
          run-timeout: 360
          kconfig: .github/kconfigs/legacy-kernel.config
          vmlinux-h: false
          run: |
            set -eu
            uname -a

      - name: Report
        if: always()
        shell: bash
        run: |
          set +e
          echo "::group::Host toolchain and QEMU"
          dpkg-query -W qemu-system-x86 qemu-system-common qemu-system-data seabios binutils gcc-13
          qemu-system-x86_64 --version
          pipx list --short 2>/dev/null
          echo "::endgroup::"

          echo "::group::Kernel image"
          ls -la linux linux/arch/x86/boot
          sha256sum linux/arch/x86/boot/bzImage linux/.config
          grep -E '^CONFIG_(RELOCATABLE|RANDOMIZE_BASE|PHYSICAL_START|SMP|X86_5LEVEL|PARAVIRT|DEBUG_INFO)=' linux/.config
          echo "::endgroup::"

          echo "::group::QEMU debug log (tail)"
          sudo tail -n 200 "$RUNNER_TEMP/qemu-debug.log"
          echo "::endgroup::"

          echo "::group::RIP samples"
          cat "$RIP_SAMPLES"
          echo "::endgroup::"

          echo "::group::RIP -> System.map"
          grep -oE 'rip +0x[0-9a-f]+' "$RIP_SAMPLES" | awk '{print $2}' | sort -u | while read -r rip; do
            python3 - "$rip" linux/System.map <<'EOF'
          import sys
          rip = int(sys.argv[1], 16)
          # Before the switch to kernel virtual addresses RIP is physical.
          if rip < 0xffffffff00000000:
              rip += 0xffffffff80000000
          best = None
          for line in open(sys.argv[2]):
              addr, _, sym = line.split()
              addr = int(addr, 16)
              if addr <= rip and (best is None or addr > best[0]):
                  best = (addr, sym)
          if best:
              print(f"{sys.argv[1]} -> {best[1]}+{rip - best[0]:#x}")
          else:
              print(f"{sys.argv[1]} -> ?")
          EOF
          done
          echo "::endgroup::"

          echo "boot outcome: ${{ steps.boot.outcome }}"

  go-test-windows:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -coverprofile coverage.txt -count=1 -v -timeout=10m ./...

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  go-test-bsd:
    name: ${{ matrix.os.name }} ${{ matrix.os.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: cpa.sh {0}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: freebsd
            version: '15.1'
          - name: openbsd
            version: '7.9'
          - name: netbsd
            version: '10.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start ${{ matrix.os.name }} VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: ${{ matrix.os.name }}
          architecture: x86-64
          version: ${{ matrix.os.version }}

      - name: Install Go
        run: |
          set -eu

          case "${{ matrix.os.name }}" in
            freebsd)
              sudo pkg install -y go
              ;;
            openbsd)
              sudo pkg_add go
              ;;
            netbsd)
              sudo pkgin -y install go
              ;;
            *)
              echo "unsupported OS: ${{ matrix.os.name }}" >&2
              exit 1
              ;;
          esac

      - name: PTY probe
        continue-on-error: true
        run: |
          set -eu
          case "${{ matrix.os.name }}" in
            openbsd)
              export PATH="/usr/local/bin:$PATH"
              ;;
            netbsd)
              go_bin="$(find /usr/pkg -path '*/bin/go' \( -type f -o -type l \) -print | head -n 1)"
              if [ -z "$go_bin" ] || [ ! -x "$go_bin" ]; then
                pkg_info -a | sed -n '/^go/p'
                echo "unable to locate the installed Go toolchain" >&2
                exit 1
              fi
              export PATH="$(dirname "$go_bin"):/usr/pkg/bin:$PATH"
              ;;
          esac
          uname -a
          go version

      - name: Run tests
        run: |
          set -eu
          case "${{ matrix.os.name }}" in
            openbsd)
              export PATH="/usr/local/bin:$PATH"
              ;;
            netbsd)
              go_bin="$(find /usr/pkg -path '*/bin/go' \( -type f -o -type l \) -print | head -n 1)"
              if [ -z "$go_bin" ] || [ ! -x "$go_bin" ]; then
                pkg_info -a | sed -n '/^go/p'
                echo "unable to locate the installed Go toolchain" >&2
                exit 1
              fi
              export PATH="$(dirname "$go_bin"):/usr/pkg/bin:$PATH"
              ;;
          esac
          go version
          go test -coverprofile coverage.txt -count=1 -v -timeout=10m ./...

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  go-test-race:
    name: ubuntu-24.04 race
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run race tests
        run: go test -coverprofile coverage.txt -race -count=1 -timeout=10m ./...

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # GitHub-hosted Windows runners do not reliably grant the privileges
  # required by CreateProcessAsUser for a different local user token
  # (ERROR_PRIVILEGE_NOT_HELD / 1314). Re-enable this job on a self-hosted
  # Windows runner with the required privileges.
